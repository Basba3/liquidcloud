[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidcloud"
version = "1.0.0"
description = "Modern SoundCloud TUI player with Liquid Glass aesthetics, auto-queue progression, and library integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Basba3" }
]
keywords = ["soundcloud", "tui", "music", "terminal", "player", "textual", "liquid-glass"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.70.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
liquidcloud = "liquidcloud.app:main"
sctui = "liquidcloud.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["liquidcloud*"]

[tool.setuptools.package-data]
liquidcloud = ["*.tcss", "styles.tcss"]
